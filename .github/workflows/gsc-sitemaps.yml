name: Resubmit sitemaps to Google Search Console

# Resubmits every sitemap in GSC (scripts/gsc_submit_sitemaps.py):
#  - after every successful Vercel production deploy,
#  - on the 1st of every month,
#  - by hand (Actions tab > this workflow > Run workflow).
# Needs the repo secret GSC_SERVICE_ACCOUNT_JSON (service account key, the account
# added as Owner of the property in Search Console).
on:
  deployment_status:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

jobs:
  submit:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-auth requests
      - run: python3 scripts/gsc_submit_sitemaps.py
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
