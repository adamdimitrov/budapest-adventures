name: Layout check

# Fails the PR when any published page's menu or footer drifts from its
# language master, a floating bar links to something not on the page, or a
# page is live without being in the sitemap. Fix with:
#   python3 scripts/sync_layout.py
on:
  pull_request:
  push:
    branches: [main]

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/sync_layout.py --check
