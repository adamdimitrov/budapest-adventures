<!-- ============================================================
     PREMIUM FLOATING BOTTOM BAR - BUDAPEST DINNER CRUISES
     Replicated from Seine / Budapest River Cruises
     Works with both new comparison deck (.bpa-card) and Webflow table rows
     ============================================================ -->
<style>
.sticky-mobile-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  width: 100%;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 -6px 24px rgba(15, 23, 42, 0.12);
  border-top: 1px solid rgba(226, 232, 240, 0.9);
  z-index: 99999;
  padding: 10px 18px;
  box-sizing: border-box;
  transform: translateY(115%);
  opacity: 0;
  pointer-events: none;
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
.sticky-mobile-bar.visible {
  transform: translateY(0);
  opacity: 1;
  pointer-events: auto;
}
.sticky-inner {
  max-width: 1060px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.sticky-boat-info {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  flex: 1;
}
.sticky-thumb-img {
  width: 46px;
  height: 46px;
  border-radius: 8px;
  object-fit: cover;
  flex-shrink: 0;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
  background: #0f172a;
}
.sticky-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.sticky-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.sticky-rank-badge {
  background: #fef3c7;
  color: #92400e;
  border: 1px solid #fde68a;
  font-size: 10.5px;
  font-weight: 800;
  padding: 2px 6px;
  border-radius: 4px;
  white-space: nowrap;
}
.sticky-title-row strong {
  font-size: 14px;
  font-weight: 800;
  color: #0f172a;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sticky-meta-row {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: #64748b;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sticky-price-tag {
  font-weight: 800;
  color: #047857;
}
.sticky-bullet {
  color: #cbd5e1;
  font-size: 10px;
}
.sticky-desc-text {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: #475569;
}
.btn-sticky-cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: linear-gradient(135deg, #059669 0%, #047857 100%);
  color: #ffffff !important;
  font-size: 13.5px;
  font-weight: 800;
  padding: 10px 22px;
  border-radius: 10px;
  text-decoration: none !important;
  box-shadow: 0 4px 14px rgba(5, 150, 105, 0.35);
  transition: all 0.15s ease;
  flex-shrink: 0;
  letter-spacing: 0.2px;
  white-space: nowrap;
}
.btn-sticky-cta:hover {
  background: linear-gradient(135deg, #047857 0%, #065f46 100%);
  box-shadow: 0 6px 18px rgba(5, 150, 105, 0.45);
  transform: translateY(-1px);
}
@media (max-width: 768px) {
  .sticky-mobile-bar { padding: 8px 12px; }
  .sticky-inner { gap: 10px; }
  .sticky-thumb-img { width: 38px; height: 38px; }
  .sticky-title-row strong { font-size: 12.5px; }
  .sticky-rank-badge { display: none; }
  .sticky-desc-text { display: none; }
  .sticky-bullet { display: none; }
  .btn-sticky-cta { padding: 8px 15px; font-size: 12.5px; }
}
</style>

<aside class="sticky-mobile-bar" id="sticky-bar" aria-label="Current Cruise Quick Reservation">
  <div class="sticky-inner">
    <div class="sticky-boat-info">
      <img id="sticky-thumb" src="https://cdn.prod.website-files.com/60e43c7d6d05b671dff0dc1a/64c683ce54d6bc13eb860a03_Legenda-dinner-cruise%20(1).webp" alt="Dinner Cruise" class="sticky-thumb-img">
      <div class="sticky-text">
        <div class="sticky-title-row">
          <span id="sticky-rank" class="sticky-rank-badge">#1 PICK</span>
          <strong id="sticky-name">Legenda Candlelit Dinner</strong>
        </div>
        <div class="sticky-meta-row">
          <span id="sticky-price" class="sticky-price-tag">From €110</span>
          <span class="sticky-bullet">•</span>
          <span id="sticky-desc" class="sticky-desc-text">4-Course Candlelit Dinner &amp; Live Music • Dock 7</span>
        </div>
      </div>
    </div>
    <a id="sticky-cta-btn" href="https://legenda.hu/en?partner=38585" class="btn-sticky-cta" target="_blank" rel="noopener">
      Reserve Legenda →
    </a>
  </div>
</aside>

<script>
(function() {
  const dinnerCruises = [
    {
      id: "1-Legenda",
      rank: "#1 PICK",
      name: "Legenda Candlelit Dinner",
      price: "From €110",
      desc: "4-Course Candlelit Dinner & Live Music • Dock 7",
      btnText: "Reserve Legenda →",
      url: "https://legenda.hu/en?partner=38585",
      img: "https://cdn.prod.website-files.com/60e43c7d6d05b671dff0dc1a/64c683ce54d6bc13eb860a03_Legenda-dinner-cruise%20(1).webp"
    },
    {
      id: "2-Silverline-no-show",
      rank: "#2 BEST VALUE",
      name: "Silverline (Without Show)",
      price: "From €74",
      desc: "4-Course Dinner & Welcome Drink • Dock 11",
      btnText: "Reserve Silverline →",
      url: "https://budapestrivercruise.eu/product/dinner-lights/?code=bpadventures",
      img: "https://cdn.prod.website-files.com/60e43c7d6d05b671dff0dc1a/68e41e56d6fe9d92b22c15ed_best-budapest-dinner-cruises-silverline-113.avif"
    },
    {
      id: "3-Silverline-folklore",
      rank: "#3 FOLK SHOW",
      name: "Silverline Folklore Dinner",
      price: "From €91",
      desc: "4-Course Dinner & Folk Operetta • Dock 11",
      btnText: "Reserve Folklore Show →",
      url: "https://budapestrivercruise.eu/product/budapest-danube-dinner-cruise/?code=bpadventures",
      img: "https://cdn.prod.website-files.com/60e43c7d6d05b671dff0dc1a/64c6868b8034e67971691de7_Dinner-cruise-silverline-folklore-operetta%20(4).webp"
    },
    {
      id: "4-silverline-piano",
      rank: "#4 PIANO BATTLE",
      name: "Silverline Piano Show",
      price: "From €91",
      desc: "4-Course Dinner & Live Piano Battle • Dock 11",
      btnText: "Reserve Piano Battle →",
      url: "https://budapestrivercruise.eu/product/dinner-cruise-piano-battle-show/?code=bpadventures",
      img: "https://cdn.prod.website-files.com/60e43c7d6d05b671dff0dc1a/64c8d727b3337948370e587c_Silverline-dinner-cruise-piano-show%20(1).webp"
    },
    {
      id: "5-Hungaria-Koncert",
      rank: "#5 BUFFET & SHOW",
      name: "Hungária Koncert Buffet",
      price: "From €79",
      desc: "12-Course Buffet, Live Music & Folk Show • Dock 3",
      btnText: "Reserve Buffet Cruise →",
      url: "https://budapestxplore.com/en/budapest-dinner-and-cruise-with-live-music-xpZDZlZTExMN?affi=6876",
      img: "https://cdn.prod.website-files.com/60e43c7d6d05b671dff0dc1a/6a1713752e3e5a94222ca4d1_hungaria-koncert-00001.avif"
    },
    {
      id: "6-Eurama",
      rank: "#6 LIVE OPERETTA",
      name: "Eurama Dinner Cruise",
      price: "From €90",
      desc: "4-Course Meal & Operetta Show • Dock 6",
      btnText: "Reserve Eurama →",
      url: "https://www.getyourguide.com/budapest-l29/budapest-evening-cruise-and-dinner-with-champagne-t408084/?partner_id=YS414AJ&utm_medium=online_publisher&cmp=eng-dinner-cruises-budapest-eurama-reviews&mkt_cmp=true",
      img: "https://cdn.prod.website-files.com/60e43c7d6d05b671dff0dc1a/64c900ca825d106c4aba1091_Dinner-cruise-eurama-sightseeing%20(11).webp"
    },
    {
      id: "7-unlimited-drinks",
      rank: "#7 UNLIMITED DRINKS",
      name: "River Diva / Rubin Group",
      price: "From €99",
      desc: "4-Course Dinner, Live Music & Open Bar • Dock 8A",
      btnText: "Reserve Open Bar →",
      url: "https://www.getyourguide.com/budapest-l29/budapestpremium-dinner-cruise-live-music-unlimited-drinks-t494832/?partner_id=YS414AJ&utm_medium=online_publisher&cmp=budapest-dinner-cruises-comparison-list-unlimited-drinks",
      img: "https://cdn.prod.website-files.com/60e43c7d6d05b671dff0dc1a/68e7f8b85dd0bfdd37755de4_best-budapest-dinner-cruises-unlimited-drinks.avif"
    }
  ];

  function updateFloatingCTA() {
    const bar = document.getElementById("sticky-bar");
    if (!bar) return;

    // Support both unified deck cards (.bpa-card) and native Webflow comparison rows
    const bpaCards = Array.from(document.querySelectorAll(".bpa-card"));
    const tableRows = Array.from(document.querySelectorAll(".table-row-grey-3, .table-row-grey-3-copy"));
    const targetCards = bpaCards.length >= 5 ? bpaCards : (tableRows.length >= 5 ? tableRows : []);

    // Also support anchor review targets
    const reviewTargets = dinnerCruises.map(c => document.getElementById(c.id)).filter(Boolean);

    const allTrackingElements = targetCards.concat(reviewTargets);
    if (!allTrackingElements.length) return;

    const vCenter = window.innerHeight / 2;
    const firstElem = allTrackingElements[0];
    const lastElem = allTrackingElements[allTrackingElements.length - 1];

    const firstTop = firstElem.getBoundingClientRect().top;
    const lastBottom = lastElem.getBoundingClientRect().bottom;

    // Hide if reader is above the first cruise or past the last cruise
    if (firstTop > vCenter || lastBottom < vCenter) {
      bar.classList.remove("visible");
      return;
    }

    let activeIdx = 0;
    let minDistance = Infinity;

    // 1. Check primary cards
    targetCards.forEach((card, idx) => {
      const rect = card.getBoundingClientRect();
      if (rect.top <= vCenter && rect.bottom >= vCenter) {
        activeIdx = idx;
        minDistance = -1; // Exact match
      } else if (minDistance !== -1) {
        const dist = Math.abs(rect.top + rect.height / 2 - vCenter);
        if (dist < minDistance) {
          minDistance = dist;
          activeIdx = idx;
        }
      }
    });

    // 2. Check detailed review sections
    reviewTargets.forEach((target, idx) => {
      const rect = target.getBoundingClientRect();
      if (rect.top <= vCenter && rect.bottom >= vCenter) {
        activeIdx = idx;
        minDistance = -1;
      } else if (minDistance !== -1) {
        const dist = Math.abs(rect.top - vCenter);
        if (dist < minDistance) {
          minDistance = dist;
          activeIdx = idx;
        }
      }
    });

    if (activeIdx >= 0 && activeIdx < dinnerCruises.length) {
      const cruise = dinnerCruises[activeIdx];
      const thumbEl = document.getElementById("sticky-thumb");
      const rankEl = document.getElementById("sticky-rank");
      const nameEl = document.getElementById("sticky-name");
      const priceEl = document.getElementById("sticky-price");
      const descEl = document.getElementById("sticky-desc");
      const btnEl = document.getElementById("sticky-cta-btn");

      if (thumbEl && cruise.img) thumbEl.src = cruise.img;
      if (rankEl) rankEl.textContent = cruise.rank;
      if (nameEl) nameEl.textContent = cruise.name;
      if (priceEl) priceEl.textContent = cruise.price;
      if (descEl) descEl.textContent = cruise.desc;
      if (btnEl) {
        btnEl.href = cruise.url;
        btnEl.textContent = cruise.btnText;
      }

      bar.classList.add("visible");
    }
  }

  let ticking = false;
  window.addEventListener("scroll", function() {
    if (!ticking) {
      ticking = true;
      requestAnimationFrame(function() {
        updateFloatingCTA();
        ticking = false;
      });
    }
  }, { passive: true });

  // Run on load and DOM ready
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", updateFloatingCTA);
  } else {
    updateFloatingCTA();
  }
  window.addEventListener("load", updateFloatingCTA);
  setTimeout(updateFloatingCTA, 400);
})();
</script>
