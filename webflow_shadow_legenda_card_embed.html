    }
  };

  let lgnState = {
    tour: "evening",
    date: "",
    slot: "19:00",
    pax: { adult: 2, youth: 0, child: 0 }
  };

  const now = new Date();
  lgnState.date = now.toISOString().split('T')[0];
  const select = root.getElementById('lgn-date-dropdown');
  for (let i = 0; i < 10; i++) {
    const d = new Date();
    d.setDate(d.getDate() + i);
    const iso = d.toISOString().split('T')[0];
    let label = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    if (i === 0) label = "Today, " + label;
    else if (i === 1) label = "Tomorrow, " + label;

    const opt = document.createElement('option');
    opt.value = iso;
    opt.textContent = label;
    select.appendChild(opt);
  }
  select.addEventListener('change', (e) => {
    lgnState.date = e.target.value;
    recalc();
  });

  function renderSlots() {
    const tour = LGN_CONFIG.tours[lgnState.tour];
    const grid = root.getElementById('lgn-slots-grid');
    grid.innerHTML = tour.slots.map(s => `
      <button type="button" class="lgn-slot-chip ${s.time === lgnState.slot ? 'active' : ''}" data-slot="${s.time}">
        <span class="lgn-slot-time">${s.time}</span>
        <span class="lgn-slot-tag ${s.isWarn ? 'warn' : ''}">${s.tag}</span>
      </button>
    `).join('');

    grid.querySelectorAll('.lgn-slot-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        lgnState.slot = btn.getAttribute('data-slot');
        renderSlots();
        recalc();
      });
    });
  }

  function recalc() {
    const tour = LGN_CONFIG.tours[lgnState.tour];
    const total = (lgnState.pax.adult * tour.rates.adult) + (lgnState.pax.youth * tour.rates.youth);
    root.getElementById('lgn-total-price').textContent = '€' + total.toFixed(2);

    const paxDesc = [lgnState.pax.adult + ' Adult' + (lgnState.pax.adult > 1 ? 's' : '')];
    if (lgnState.pax.youth > 0) paxDesc.push(lgnState.pax.youth + ' Youth');
    if (lgnState.pax.child > 0) paxDesc.push(lgnState.pax.child + ' Free Kid');
    root.getElementById('lgn-summary-desc').textContent = paxDesc.join(', ') + ' • ' + lgnState.slot + ' Departure';

    const query = new URLSearchParams({
      partner: LGN_CONFIG.partnerId,
      cruise: tour.id,
      date: lgnState.date,
      time: lgnState.slot,
      adults: lgnState.pax.adult,
      youth: lgnState.pax.youth,
      children: lgnState.pax.child
    });
    root.getElementById('lgn-cta-btn').href = 'https://legenda.hu/en/ticket-purchase?' + query.toString();
  }

  function setTour(tKey) {
    lgnState.tour = tKey;
    root.getElementById('lgn-tour-evening').classList.toggle('active', tKey === 'evening');
    root.getElementById('lgn-tour-daytime').classList.toggle('active', tKey === 'daytime');
    const tour = LGN_CONFIG.tours[tKey];
    root.getElementById('lgn-perk-drink').innerHTML = tour.drink;
    root.getElementById('lgn-rate-adult').textContent = '€' + tour.rates.adult.toFixed(2);
    root.getElementById('lgn-rate-youth').textContent = '€' + tour.rates.youth.toFixed(2);
    lgnState.slot = (tKey === 'evening') ? '19:00' : '12:30';
    renderSlots();
    recalc();
  }

  root.getElementById('lgn-tour-evening').addEventListener('click', () => setTour('evening'));
  root.getElementById('lgn-tour-daytime').addEventListener('click', () => setTour('daytime'));

  function setDatePreset(preset) {
    const d = new Date();
    if (preset === 'tomorrow') d.setDate(d.getDate() + 1);
    const iso = d.toISOString().split('T')[0];
    lgnState.date = iso;
    root.getElementById('lgn-date-today').classList.toggle('active', preset === 'today');
    root.getElementById('lgn-date-tomorrow').classList.toggle('active', preset === 'tomorrow');
    select.value = iso;
    recalc();
  }

  root.getElementById('lgn-date-today').addEventListener('click', () => setDatePreset('today'));
  root.getElementById('lgn-date-tomorrow').addEventListener('click', () => setDatePreset('tomorrow'));

  function updatePax(type, delta) {
    const next = lgnState.pax[type] + delta;
    if (type === 'adult' && next < 1) return;
    if (next < 0 || next > 20) return;
    lgnState.pax[type] = next;
    root.getElementById('lgn-val-' + type).textContent = next;
    root.getElementById('lgn-btn-' + type + '-minus').disabled = (type === 'adult' && next <= 1) || (type !== 'adult' && next <= 0);
    recalc();
  }

  root.getElementById('lgn-btn-adult-minus').addEventListener('click', () => updatePax('adult', -1));
  root.getElementById('lgn-btn-adult-plus').addEventListener('click', () => updatePax('adult', 1));
  root.getElementById('lgn-btn-youth-minus').addEventListener('click', () => updatePax('youth', -1));
  root.getElementById('lgn-btn-youth-plus').addEventListener('click', () => updatePax('youth', 1));
  root.getElementById('lgn-btn-child-minus').addEventListener('click', () => updatePax('child', -1));
  root.getElementById('lgn-btn-child-plus').addEventListener('click', () => updatePax('child', 1));

  root.getElementById('lgn-cta-btn').addEventListener('click', () => {
    const tour = LGN_CONFIG.tours[lgnState.tour];
    const total = (lgnState.pax.adult * tour.rates.adult) + (lgnState.pax.youth * tour.rates.youth);
    if (typeof window.fbq === 'function') {
      window.fbq('track', 'InitiateCheckout', {
        content_name: 'Legenda ' + tour.name,
        content_category: 'River Cruise',
        value: total,
        currency: 'EUR'
      });
    }
  });

  renderSlots();
  recalc();
})();
</script>
