.bpa-src{font-size:12px;color:#64748b;margin-top:12px;line-height:1.5}
.bpa-src a{color:#475569 !important}
.bpa-table-wrap{overflow-x:auto;margin:8px 0 20px}
.bpa-table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.bpa-table caption{caption-side:bottom;text-align:left;font-size:12px;color:#64748b;padding-top:8px}

.bpa-table td{border-bottom:1px solid #f1f5f9;padding:8px 10px;color:#334155;white-space:nowrap}
.bpa-table td:not(:first-child),.bpa-table th:not(:first-child){text-align:right}
.bpa-details{margin:4px 0 24px}
.bpa-details summary{cursor:pointer;font-size:14px;font-weight:600;color:#1e3a5f}
.bpa-cite{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:16px;font-size:15px;line-height:1.6;color:#334155;margin:16px 0}
